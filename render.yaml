services:
  - type: web
    name: API de Posts tipo Pinterest
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: fastapi run app/main.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: pin-minimal-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
